name: CI

on:
  push:
    branches: [main]
  pull_request:

# En az yetki: işler yalnız okur. Yazma (release) yalnız spa-surum işinde, iş düzeyinde açılır.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Entegrasyon testleri gerçek PostgreSQL ister (RLS rol/policy doğrulaması).
    # GitHub-hosted runner Docker Hub'a erişebildiği için service container kullanıyoruz.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test fixture'ının admin (superuser) bağlantısı. Fixture buradan
      # racar_owner/racar_app rollerini ve çalıştırma başına benzersiz DB'yi oluşturur.
      RACAR_TEST_PG_ADMIN: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # TFM ile birlikte değişen sürüm (bkz. Directory.Build.props).
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore RentACar.slnx

      - name: Build
        run: dotnet build RentACar.slnx -c Release --no-restore

      - name: Test
        run: dotnet test RentACar.slnx -c Release --no-build --verbosity normal

  # ---------------------------------------------------------------------------
  # Mobil taşma koruması — yeni bir sayfa telefonda yatay kaydırma üretirse build kırılır.
  #
  # Neden AYRI iş: gerçek tarayıcı (Playwright) + ayağa kalkmış uygulama ister; entegrasyon
  # testleriyle aynı işe koymak testleri yavaşlatır ve iki farklı arıza sınıfını tek kırmızıya
  # karıştırır.
  #
  # KAPSAM SINIRI (bilinçli): CI veritabanı yalnız kiracı + kullanıcı tohumlar, iş verisi
  # tohumlamaz. Boş bir liste taşmadığı için kart görünümü kuralları burada ÖLÇÜLMEZ; koşum
  # bunu "tablo var ama satır YOK" satırıyla açıkça bildirir. Burada yakalanan sınıf kabuk,
  # form, ızgara ve filtre çubuğu taşmalarıdır — ki 145 sayfayı birden bozan sınıf tam da budur.
  mobil-tasma:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: racar_owner
          POSTGRES_PASSWORD: racar_owner_pw
          POSTGRES_DB: racar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U racar_owner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=localhost;Port=5432;Database=racar;Username=racar_app;Password=racar_app_pw"
      ConnectionStrings__Migrator: "Host=localhost;Port=5432;Database=racar;Username=racar_owner;Password=racar_owner_pw"

    steps:
      - uses: actions/checkout@v4

      - name: Kısıtlı runtime rolü (racar_app) — RLS bu role uygulanır
        run: PGPASSWORD=racar_owner_pw psql -h localhost -U racar_owner -d racar -v ON_ERROR_STOP=1 -f scripts/db-init-roles.sql

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Playwright (yalnız chromium)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Seed parolası repoda YOK: her koşuda rastgele; uygulama Seed__Parola ile tohumlar,
      # koşum RACAR_GIRIS_SIFRE ile girer (maskeli — loga düşmez).
      - name: Seed parolası (her koşuda rastgele)
        run: |
          P=$(openssl rand -hex 16)
          echo "::add-mask::$P"
          echo "Seed__Parola=$P" >> "$GITHUB_ENV"
          echo "RACAR_GIRIS_SIFRE=$P" >> "$GITHUB_ENV"

      - name: Uygulamayı ayağa kaldır
        run: |
          # --no-launch-profile: launchSettings.json aksi halde ASPNETCORE_URLS'i EZİYOR
          # (uygulama 5220'de açılıyor, sağlık yoklaması başka portu dinliyordu).
          ASPNETCORE_URLS=http://localhost:5220 \
            dotnet run --project src/RentACar.Web --no-launch-profile > /tmp/web.log 2>&1 &
          for _ in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5220/health/live)" = "200" ]; then
              echo "hazır"; exit 0
            fi
            sleep 5
          done
          echo "uygulama ayağa kalkmadı"; cat /tmp/web.log; exit 1

      - name: Taşma koşumu (390px telefon)
        run: node scripts/mobil-tasma.mjs --tum

      - name: Taşma koşumu (320px en dar cihaz)
        run: node scripts/mobil-tasma.mjs --tum --genislik 320

      - name: Taşma koşumu (768px tablet)
        run: node scripts/mobil-tasma.mjs --tum --genislik 768

      - name: Uygulama günlüğü (yalnız hata durumunda)
        if: failure()
        run: cat /tmp/web.log

  # ---------------------------------------------------------------------------
  # Yeni arayüz (Angular, src/RentACar.Frontend) kalite kapıları.
  #
  # Yol filtresi YOK (bilinçli): kapılar her PR'da koşar, "frontend'e dokunmadım" varsayımı
  # kırmızıyı gizlemez. .NET işlerinden bağımsızdır; Node 22 sabit (.nvmrc / engines).
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/RentACar.Frontend

    env:
      NG_CLI_ANALYTICS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/RentACar.Frontend/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      # docs/api/ui-v1.json (.NET testi canlı OpenAPI'yle kilitler) → src/app/core/api/uretilen/ui-v1.ts.
      # Yeniden üretilen dosya commit'lenenden farklıysa KIRMIZI: API değişti ama tipler güncellenmedi.
      - name: API tip kayması (openapi-typescript)
        run: npm run tipler:kontrol

      - name: Biçim (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tip denetimi (strictTemplates)
        run: npm run typecheck

      - name: Birim testleri (Vitest)
        run: npm test

      - name: Production derlemesi (bütçeler)
        run: npm run build

  # ---------------------------------------------------------------------------
  # Yeni arayüz duman testi: production derlemesi /app/ altında, üretim CSP'siyle + axe.
  # Chromium önbellekten gelir (anahtar: package-lock → Playwright sürümü değişince yenilenir).
  e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/RentACar.Frontend

    env:
      NG_CLI_ANALYTICS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/RentACar.Frontend/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Playwright tarayıcı önbelleği
        id: pw-onbellek
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/RentACar.Frontend/package-lock.json') }}

      - name: Chromium (önbellek yoksa indir)
        if: steps.pw-onbellek.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --only-shell chromium

      - name: Chromium sistem kütüphaneleri (önbellek varsa)
        if: steps.pw-onbellek.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: e2e (derleme + Playwright + axe)
        run: npm run e2e

      - name: Playwright izleri (yalnız hata durumunda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-izleri
          path: src/RentACar.Frontend/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Dağıtım betikleri: shellcheck + yayinla.sh'ın guard'ları ve SPA artifact adımı (sahte GitHub
  # API'sine karşı: checksum/yanlış SHA/eksik artifact reddi, chunk taşıma sınırı, token sızmazlığı).
  # Sunucuya hiçbir şey gitmez; Linux araçlarıyla (GNU tar/cp) koşması asıl değeri.
  deploy-betikleri:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck deploy/yayinla.sh deploy/kurulum.sh deploy/guard-testi.sh deploy/spa-testi.sh

      - name: yayinla.sh guard testleri
        run: bash deploy/guard-testi.sh

      - name: yayinla.sh SPA artifact testleri
        run: bash deploy/spa-testi.sh

  # ---------------------------------------------------------------------------
  # SPA sürüm artifact'ı: main'e her push'ta, TÜM kapılar yeşilse. Sunucu (deploy/yayinla.sh)
  # checkout ettiği SHA'nın `spa-<sha>` release'ini salt-okur token'la indirir → "artifact var" ==
  # "o commit'in CI'ı yeşil". PR'larda koşmaz; yazma yetkisi yalnız bu işte.
  spa-surum:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, mobil-tasma, frontend, e2e, deploy-betikleri]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: src/RentACar.Frontend

    env:
      NG_CLI_ANALYTICS: "false"
      SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/RentACar.Frontend/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Production derlemesi
        run: npm run build

      - name: Paketle (spa-<sha>.tar.gz + .sha256 + chunks.txt)
        working-directory: src/RentACar.Frontend/dist/rentacar-frontend
        run: |
          set -euo pipefail
          test -f browser/index.html
          # Hash'li dosyalar (SpaBarindirma'daki desen: ad-HASH.uzantı, HASH ≥ 8 büyük harf/rakam).
          # yayinla.sh bir sonraki yayında YALNIZ bu listeyi taşır → açık sekmeler eski chunk'ları bulur, birikmez.
          (cd browser && find . -type f | sed 's|^\./||' \
            | grep -E '(^|/)[^/]+-[A-Z0-9]{8,}\.[A-Za-z0-9]+$' | LC_ALL=C sort) > chunks.txt
          test -s chunks.txt
          printf '%s\n' "$SHA" > SURUM
          tar --owner=0 --group=0 --numeric-owner -czf "spa-$SHA.tar.gz" browser chunks.txt SURUM
          sha256sum "spa-$SHA.tar.gz" > "spa-$SHA.tar.gz.sha256"
          cat "spa-$SHA.tar.gz.sha256"
          echo "$(wc -l < chunks.txt) hash'li dosya"

      - name: GitHub release (spa-<sha>)
        working-directory: src/RentACar.Frontend/dist/rentacar-frontend
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DOSYALAR=("spa-$SHA.tar.gz" "spa-$SHA.tar.gz.sha256" chunks.txt)
          # Yeniden koşum (yarım kalmış yükleme) güvenli: release varsa asset'ler değiştirilir.
          if gh release view "spa-$SHA" >/dev/null 2>&1; then
            gh release upload "spa-$SHA" "${DOSYALAR[@]}" --clobber
          else
            gh release create "spa-$SHA" "${DOSYALAR[@]}" --target "$SHA" --prerelease \
              --title "SPA $SHA" \
              --notes "main@$SHA yeni arayüz derlemesi. Sunucuda deploy/yayinla.sh bu commit checkout edilince indirir ve sha256 doğrular."
          fi
