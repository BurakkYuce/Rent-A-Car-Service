name: CI

on:
  push:
    branches: [main]
  pull_request:

# En az yetki: işler yalnız okur. Yazma (release) yalnız spa-surum işinde, iş düzeyinde açılır.
permissions:
  contents: read

# Actions dakika bütçesi (private repo, aylık 3.000 dk): aynı PR'a yeni push gelince eski koşu
# İPTAL edilir. main'de iptal yok: her main SHA'sı kendi spa-<sha> artifact'ını üretmeli.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Değişiklik tespiti: her ağır iş yalnız kendi alanına dokunulduysa koşar. Workflow dosyası
  # değişirse hepsi koşar (CI'ın kendisi test edilir). Yanlış negatif riski: bir alanın dosyası
  # başka alanın listesinde unutulursa o iş atlanır — yeni kök dizin eklerken bu listeyi güncelle.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      deploy: ${{ steps.f.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            ci: &ci
              - '.github/workflows/**'
            backend:
              - *ci
              - 'src/RentACar.Domain/**'
              - 'src/RentACar.Application/**'
              - 'src/RentACar.Infrastructure/**'
              - 'src/RentACar.Web/**'
              - 'src/RentACar.Api/**'
              - 'src/RentACar.PublicSite/**'
              - 'tests/**'
              - 'docs/api/**'
              - 'scripts/db-init-roles.sql'
              - 'RentACar.slnx'
              - 'Directory.*.props'
              - 'global.json'
              - '.editorconfig'
            frontend:
              - *ci
              - 'src/RentACar.Frontend/**'
              - 'docs/api/ui-v1.json'
            deploy:
              - *ci
              - 'deploy/**'

  build-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    # Entegrasyon testleri gerçek PostgreSQL ister (RLS rol/policy doğrulaması).
    # GitHub-hosted runner Docker Hub'a erişebildiği için service container kullanıyoruz.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Test fixture'ının admin (superuser) bağlantısı. Fixture buradan
      # racar_owner/racar_app rollerini ve çalıştırma başına benzersiz DB'yi oluşturur.
      RACAR_TEST_PG_ADMIN: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # TFM ile birlikte değişen sürüm (bkz. Directory.Build.props).
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore RentACar.slnx

      - name: Build
        run: dotnet build RentACar.slnx -c Release --no-restore

      - name: Test
        run: dotnet test RentACar.slnx -c Release --no-build --verbosity normal

  # ---------------------------------------------------------------------------
  # F13: Blazor mobil taşma işi (mobil-tasma, kök package.json + scripts/mobil-tasma.mjs) Blazor sayfalarıyla birlikte
  # kalktı. Taşma koruması yeni arayüzün e2e'sinde (320/390/768/1440, frontend işi).
  #
  # ---------------------------------------------------------------------------
  # Yeni arayüz (Angular, src/RentACar.Frontend) kalite kapıları.
  #
  # Yol filtresi VAR (Actions dakika bütçesi): frontend'e ya da OpenAPI anlık görüntüsüne dokunan
  # PR'da koşar. Kalite kapıları + e2e TEK işte: npm ci ve production derlemesi bir kez yapılır
  # (`npm run e2e` = `ng build` + Playwright; bütçeler bu derlemede denetlenir).
  #
  # Neden KONTEYNER (F3.7): ekran görüntüsü tabanları piksel düzeyinde işletim sistemine/fonta/tarayıcı
  # derlemesine bağlı. İş, tabanların üretildiği imajın AYNISINDA koşar (yerelde `npm run e2e:gorsel`
  # aynı imajı linux/amd64 ile çalıştırır). İmaj etiketi @playwright/test sürümüyle AYNI olmalı.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble

    defaults:
      run:
        working-directory: src/RentACar.Frontend

    env:
      NG_CLI_ANALYTICS: "false"

    steps:
      - uses: actions/checkout@v4

      # Konteynerde çalışma dizininin sahibi farklı: git (tipler:kontrol'deki git diff) "dubious ownership" der.
      - name: git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/RentACar.Frontend/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      # docs/api/ui-v1.json (.NET testi canlı OpenAPI'yle kilitler) → src/app/core/api/uretilen/ui-v1.ts.
      # Yeniden üretilen dosya commit'lenenden farklıysa KIRMIZI: API değişti ama tipler güncellenmedi.
      - name: API tip kayması (openapi-typescript)
        run: npm run tipler:kontrol

      - name: Biçim (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tip denetimi (strictTemplates)
        run: npm run typecheck

      - name: Birim testleri (Vitest)
        run: npm test

      # Production derlemesi /app/ altında, üretim CSP'siyle (bütçeler dahil); işlev + axe (iki tema) +
      # 320–1440 px gövde taşması (`--project=chromium`) ve görsel regresyon (`--project=gorsel`).
      - name: e2e (production derlemesi + Playwright + axe + taşma)
        run: npm run e2e

      # Tabanlar e2e/gorsel-tabanlari/ (commit'li). CI eksik tabanı yazmaz, kırmızı verir.
      # Güncelleme: `npm run e2e:gorsel:guncelle` (Docker) ya da "Görsel tabanlar" iş akışı (elle).
      - name: Görsel regresyon (açık/koyu × 320/390/768/1440)
        run: npm run e2e:gorsel:ci

      - name: Playwright izleri ve görsel farklar (yalnız hata durumunda)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-izleri
          path: src/RentACar.Frontend/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Dağıtım betikleri: shellcheck + yayinla.sh'ın guard'ları ve SPA artifact adımı (sahte GitHub
  # API'sine karşı: checksum/yanlış SHA/eksik artifact reddi, chunk taşıma sınırı, token sızmazlığı).
  # Sunucuya hiçbir şey gitmez; Linux araçlarıyla (GNU tar/cp) koşması asıl değeri.
  deploy-betikleri:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck deploy/yayinla.sh deploy/kurulum.sh deploy/guard-testi.sh deploy/spa-testi.sh

      - name: yayinla.sh guard testleri
        run: bash deploy/guard-testi.sh

      - name: yayinla.sh SPA artifact testleri
        run: bash deploy/spa-testi.sh

  # ---------------------------------------------------------------------------
  # SPA sürüm artifact'ı: main'e her push'ta, TÜM kapılar yeşilse. Sunucu (deploy/yayinla.sh)
  # checkout ettiği SHA'nın `spa-<sha>` release'ini salt-okur token'la indirir → "artifact var" ==
  # "o commit'in CI'ı yeşil". PR'larda koşmaz; yazma yetkisi yalnız bu işte.
  # Yol filtresiyle atlanan işler "skipped" olur; artifact yine üretilir ama koşan işlerden biri
  # bile başarısız ya da iptalse ÜRETİLMEZ ("artifact var" == "o commit'in koşan kapıları yeşil").
  spa-surum:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [changes, build-test, frontend, deploy-betikleri]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: src/RentACar.Frontend

    env:
      NG_CLI_ANALYTICS: "false"
      SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/RentACar.Frontend/package-lock.json

      - name: Bağımlılıklar
        run: npm ci

      - name: Production derlemesi
        run: npm run build

      - name: Paketle (spa-<sha>.tar.gz + .sha256 + chunks.txt)
        working-directory: src/RentACar.Frontend/dist/rentacar-frontend
        run: |
          set -euo pipefail
          test -f browser/index.html
          # Hash'li dosyalar (SpaBarindirma'daki desen: ad-HASH.uzantı, HASH ≥ 8 büyük harf/rakam).
          # yayinla.sh bir sonraki yayında YALNIZ bu listeyi taşır → açık sekmeler eski chunk'ları bulur, birikmez.
          (cd browser && find . -type f | sed 's|^\./||' \
            | grep -E '(^|/)[^/]+-[A-Z0-9]{8,}\.[A-Za-z0-9]+$' | LC_ALL=C sort) > chunks.txt
          test -s chunks.txt
          printf '%s\n' "$SHA" > SURUM
          tar --owner=0 --group=0 --numeric-owner -czf "spa-$SHA.tar.gz" browser chunks.txt SURUM
          sha256sum "spa-$SHA.tar.gz" > "spa-$SHA.tar.gz.sha256"
          cat "spa-$SHA.tar.gz.sha256"
          echo "$(wc -l < chunks.txt) hash'li dosya"

      - name: GitHub release (spa-<sha>)
        working-directory: src/RentACar.Frontend/dist/rentacar-frontend
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          DOSYALAR=("spa-$SHA.tar.gz" "spa-$SHA.tar.gz.sha256" chunks.txt)
          # Yeniden koşum (yarım kalmış yükleme) güvenli: release varsa asset'ler değiştirilir.
          if gh release view "spa-$SHA" >/dev/null 2>&1; then
            gh release upload "spa-$SHA" "${DOSYALAR[@]}" --clobber
          else
            gh release create "spa-$SHA" "${DOSYALAR[@]}" --target "$SHA" --prerelease \
              --title "SPA $SHA" \
              --notes "main@$SHA yeni arayüz derlemesi. Sunucuda deploy/yayinla.sh bu commit checkout edilince indirir ve sha256 doğrular."
          fi
