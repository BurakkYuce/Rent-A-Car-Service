<header class="ust">
  <button
    #menuDugmesi
    type="button"
    class="ikon-dugme menu-dugmesi"
    aria-controls="rc-yan-menu"
    [attr.aria-expanded]="cekmeceAcik()"
    [attr.aria-label]="'kabuk.menuyuAc' | transloco"
    (click)="menuAc.emit()"
  >
    <rc-ikon ad="menu-2" [boyut]="18" />
  </button>
  <button
    type="button"
    class="ikon-dugme daralt-dugmesi"
    aria-controls="rc-yan-menu"
    [attr.aria-expanded]="!dar()"
    [attr.aria-label]="(dar() ? 'kabuk.menuyuGenislet' : 'kabuk.menuyuDaralt') | transloco"
    [title]="(dar() ? 'kabuk.menuyuGenislet' : 'kabuk.menuyuDaralt') | transloco"
    (click)="daralt.emit()"
  >
    <rc-ikon
      [ad]="dar() ? 'layout-sidebar-left-expand' : 'layout-sidebar-left-collapse'"
      [boyut]="18"
    />
  </button>

  <button
    type="button"
    class="palet"
    aria-haspopup="dialog"
    aria-keyshortcuts="Control+K Meta+K"
    [attr.aria-label]="('kabuk.palet.ac' | transloco) + ' (' + kisayol + ')'"
    (click)="paletAc.emit()"
  >
    <rc-ikon ad="search" [boyut]="16" />
    <span class="palet__metin">{{ 'kabuk.palet.yerTutucu' | transloco }}</span>
    <kbd class="palet__tus" aria-hidden="true">{{ kisayol }}</kbd>
  </button>

  <span class="bosluk"></span>

  <!-- YER TUTUCU: rc-plaka-arama (PR-B) gelince onunla değişir. -->
  <form
    class="plaka"
    [class.plaka--acik]="plakaAcik()"
    role="search"
    [attr.aria-label]="'kabuk.plaka.etiket' | transloco"
    (submit)="plakaAra($event, plakaGirdisi)"
  >
    <span class="plaka__serit" aria-hidden="true">TR</span>
    <input
      #plakaGirdisi
      class="plaka__girdi"
      type="text"
      autocomplete="off"
      spellcheck="false"
      enterkeyhint="search"
      maxlength="16"
      [attr.aria-label]="'kabuk.plaka.etiket' | transloco"
      [placeholder]="'kabuk.plaka.yerTutucu' | transloco"
      (keydown)="plakaTus($event)"
    />
    @if (plakaAcik()) {
      <button
        type="button"
        class="ikon-dugme plaka__kapat"
        [attr.aria-label]="'kabuk.plaka.kapat' | transloco"
        (click)="plakaAcik.set(false)"
      >
        <rc-ikon ad="x" [boyut]="16" />
      </button>
    }
  </form>
  <button
    type="button"
    class="ikon-dugme plaka-dugmesi"
    [attr.aria-label]="'kabuk.plaka.ac' | transloco"
    (click)="plakaAramasiniAc()"
  >
    <rc-ikon ad="car" [boyut]="18" />
  </button>

  @if (bildirimVar()) {
    @let sayi = rozetMetni(bildirimSayisi());
    <button
      type="button"
      class="ikon-dugme zil"
      [attr.aria-label]="
        sayi
          ? ('kabuk.bildirim.sayili' | transloco: { sayi: sayi })
          : ('kabuk.bildirim.etiket' | transloco)
      "
      (click)="bildirimAc.emit()"
    >
      <rc-ikon ad="bell" [boyut]="18" />
      @if (sayi) {
        <span class="zil__rozet" aria-hidden="true">{{ sayi }}</span>
      }
    </button>
  }

  <div class="tema" role="group" [attr.aria-label]="'tema.etiket' | transloco">
    @for (secenek of temaSecenekleri; track secenek.mod) {
      <button
        type="button"
        class="tema__dugme"
        [attr.aria-pressed]="tema.mod() === secenek.mod"
        [attr.aria-label]="secenek.etiket | transloco"
        [title]="secenek.etiket | transloco"
        (click)="tema.modAyarla(secenek.mod)"
      >
        <rc-ikon [ad]="secenek.ikon" [boyut]="16" />
      </button>
    }
  </div>
</header>
