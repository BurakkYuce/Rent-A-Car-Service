<div class="sayfa">
  <header class="ust">
    <h1>{{ 'servisSigorta.zeyil.tumBaslik' | transloco }}</h1>
  </header>
  <rc-regulation-tabs />
  <p class="aciklama">{{ 'servisSigorta.zeyil.tumAciklama' | transloco }}</p>

  <form
    class="filtre"
    [formGroup]="filterForm"
    [attr.aria-label]="'servisSigorta.filtre' | transloco"
    (ngSubmit)="filter()"
  >
    <div class="rc-form-izgara">
      <rc-alan [etiket]="'servisSigorta.plaka' | transloco">
        <rc-metin-girdisi formControlName="plaka" [azamiUzunluk]="32" />
      </rc-alan>
      <rc-alan [etiket]="'servisSigorta.zeyil.tipi' | transloco">
        <rc-metin-girdisi formControlName="tipi" [azamiUzunluk]="64" />
      </rc-alan>
      <rc-alan [etiket]="'servisSigorta.zeyil.tarihBas' | transloco">
        <rc-tarih-secici formControlName="bas" />
      </rc-alan>
      <rc-alan [etiket]="'servisSigorta.zeyil.tarihBit' | transloco">
        <rc-tarih-secici formControlName="bit" />
      </rc-alan>
    </div>
    <div class="filtre__eylemler">
      <button type="submit" class="rc-dugme rc-dugme--kucuk">
        <rc-ikon ad="filter" [boyut]="14" />
        {{ 'servisSigorta.filtrele' | transloco }}
      </button>
      <button type="button" class="rc-dugme rc-dugme--hayalet rc-dugme--kucuk" (click)="clear()">
        {{ 'servisSigorta.temizle' | transloco }}
      </button>
    </div>
  </form>

  <rc-tablo
    class="tablo"
    tabloKodu="regulasyon.zeyiller"
    [etiket]="'servisSigorta.zeyil.tabloEtiketi' | transloco"
    [sutunlar]="columns"
    [kaynak]="store.list.durum()"
    [satirKimligi]="rowId"
    [sirala]="query.sorgu().sirala"
    (siralaDegisti)="query.degistir({ sirala: $event })"
    (sayfaDegisti)="query.degistir({ sayfa: $event })"
    (boyutDegisti)="query.degistir({ boyut: $event })"
    (yenidenDene)="store.list.yenile()"
  >
    <ng-template rcTabloHucre="police" [rcTabloHucreSutunlar]="columns" let-satir>
      <a [routerLink]="['/regulasyon/sigortalar', satir.policyId]">{{
        satir.policeNo ? satir.plaka + ' — ' + satir.policeNo : satir.plaka
      }}</a>
    </ng-template>
  </rc-tablo>
</div>
