<rc-sayfa-bandi [baslik]="'teklif.baslik' | transloco" ikon="file-text">
  <a birincil class="rc-dugme rc-dugme--birincil" routerLink="/teklifler/yeni">
    <rc-ikon ad="plus" [boyut]="14" />
    {{ 'teklif.yeni' | transloco }}
  </a>
</rc-sayfa-bandi>

<div class="rc-sayfa">
  <rc-katlanir-filtre
    class="filtre"
    [baslik]="'teklif.filtre.baslik' | transloco"
    [etkinSayisi]="liste.etkinFiltreSayisi()"
    [(acik)]="filterOpen"
  >
    <form
      class="filtre__form"
      [formGroup]="filterForm"
      [attr.aria-label]="'teklif.filtre.baslik' | transloco"
      (ngSubmit)="filter()"
    >
      <div class="rc-form-izgara">
        <rc-alan [etiket]="'teklif.filtre.durum' | transloco">
          <rc-secim
            formControlName="durum"
            [secenekler]="statusOptions"
            [bosEtiket]="'teklif.filtre.tumu' | transloco"
          />
        </rc-alan>
      </div>
      <div class="filtre__eylemler">
        <button type="submit" class="rc-dugme rc-dugme--birincil rc-dugme--kucuk">
          <rc-ikon ad="filter" [boyut]="14" />
          {{ 'teklif.filtre.filtrele' | transloco }}
        </button>
        @if (liste.etkinFiltreSayisi() > 0) {
          <button
            type="button"
            class="rc-dugme rc-dugme--hayalet rc-dugme--kucuk"
            (click)="clear()"
          >
            {{ 'teklif.filtre.temizle' | transloco }}
          </button>
        }
      </div>
    </form>
  </rc-katlanir-filtre>

  <rc-tablo
    class="liste-tablosu"
    tabloKodu="teklifler.liste"
    [etiket]="'teklif.tabloEtiketi' | transloco"
    [sutunlar]="columns"
    [kaynak]="store.liste.durum()"
    [satirKimligi]="identity"
    [sirala]="liste.sorgu().sirala"
    [varsayilanSirala]="defaultSort"
    (siralaDegisti)="liste.degistir({ sirala: $event })"
    (sayfaDegisti)="liste.degistir({ sayfa: $event })"
    (boyutDegisti)="liste.degistir({ boyut: $event })"
    (yenidenDene)="store.liste.yenile()"
    (satirAc)="openRow($event)"
  >
    <ng-template rcTabloHucre="no" [rcTabloHucreSutunlar]="columns" let-satir>
      <a class="bag" [routerLink]="['/teklifler', satir.id]">{{ satir.no }}</a>
    </ng-template>

    <ng-template rcTabloHucre="plaka" [rcTabloHucreSutunlar]="columns" let-satir>
      @if (satir.plaka) {
        <rc-plaka [plaka]="satir.plaka" boyut="sm" />
      }
    </ng-template>

    <ng-template rcTabloHucre="durum" [rcTabloHucreSutunlar]="columns" let-satir>
      @if (satir.durum === 'Kabul' && satir.rezervasyonId) {
        <a [class]="rozet(satir.durum)" [routerLink]="['/rezervasyonlar', satir.rezervasyonId]">{{
          statusLabel(satir.durum)
        }}</a>
      } @else {
        <span [class]="rozet(satir.durum)">{{ statusLabel(satir.durum) }}</span>
      }
    </ng-template>

    <ng-template rcTabloHucre="islemler" [rcTabloHucreSutunlar]="columns" let-satir>
      <span class="satir-islemleri">
        @if (satir.durum === 'Taslak') {
          <button
            type="button"
            class="rc-dugme rc-dugme--kucuk"
            [disabled]="islemler.inProgress() !== null"
            (click)="gonder(satir)"
          >
            {{ 'teklif.eylem.gonder' | transloco }}
            <span class="rc-gorunmez">{{ satir.no }}</span>
          </button>
        }
        @if (acik(satir)) {
          <button
            type="button"
            class="rc-dugme rc-dugme--kucuk"
            [disabled]="islemler.inProgress() !== null"
            (click)="kabul(satir)"
          >
            <rc-ikon ad="check" [boyut]="14" />
            {{ 'teklif.eylem.kabul' | transloco }}
            <span class="rc-gorunmez">{{ satir.no }}</span>
          </button>
          <button
            type="button"
            class="rc-dugme rc-dugme--kucuk rc-dugme--hayalet"
            [disabled]="islemler.inProgress() !== null"
            (click)="reddet(satir)"
          >
            <rc-ikon ad="x" [boyut]="14" />
            {{ 'teklif.eylem.reddet' | transloco }}
            <span class="rc-gorunmez">{{ satir.no }}</span>
          </button>
        }
      </span>
    </ng-template>
  </rc-tablo>
</div>
