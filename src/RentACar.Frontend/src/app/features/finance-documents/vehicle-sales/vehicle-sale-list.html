<div class="sayfa">
  <header class="ust">
    <h1>{{ 'finansBelge.satis.baslik' | transloco }}</h1>
    @if (canWrite()) {
      <div class="ust__eylemler">
        <button
          type="button"
          class="rc-dugme rc-dugme--birincil rc-dugme--kucuk"
          [attr.aria-expanded]="createOpen()"
          aria-controls="rc-yeni-satis"
          (click)="toggleCreate()"
        >
          <rc-ikon ad="plus" [boyut]="14" />
          {{ 'finansBelge.satis.yeni' | transloco }}
        </button>
      </div>
    }
  </header>

  <form
    class="filtre"
    [formGroup]="filterForm"
    [attr.aria-label]="'finansBelge.filtre' | transloco"
    (ngSubmit)="filter()"
  >
    <div class="rc-form-izgara">
      <rc-alan [etiket]="'finansBelge.plaka' | transloco">
        <rc-metin-girdisi formControlName="plaka" [azamiUzunluk]="16" />
      </rc-alan>
      <rc-alan [etiket]="'finansBelge.satis.alici' | transloco">
        <rc-arama-secim formControlName="alici" [kaynak]="customers" />
      </rc-alan>
      <rc-alan [etiket]="'finansBelge.durum' | transloco">
        <rc-secim
          formControlName="durum"
          [secenekler]="statusOptions"
          [bosEtiket]="'finansBelge.tumu' | transloco"
        />
      </rc-alan>
      <rc-alan [etiket]="'finansBelge.satis.devirSuzgec' | transloco">
        <rc-secim
          formControlName="satisiVerildi"
          [secenekler]="transferOptions"
          [bosEtiket]="'finansBelge.tumu' | transloco"
        />
      </rc-alan>
      <rc-alan [etiket]="'finansBelge.satis.ofis' | transloco">
        <rc-metin-girdisi formControlName="ofis" [azamiUzunluk]="128" />
      </rc-alan>
      <rc-alan [etiket]="'finansBelge.tarihBas' | transloco">
        <rc-tarih-secici formControlName="bas" />
      </rc-alan>
      <rc-alan [etiket]="'finansBelge.tarihBit' | transloco">
        <rc-tarih-secici formControlName="bit" />
      </rc-alan>
    </div>
    <div class="filtre__eylemler">
      <button type="submit" class="rc-dugme rc-dugme--kucuk">
        <rc-ikon ad="filter" [boyut]="14" />
        {{ 'finansBelge.filtrele' | transloco }}
      </button>
      @if (query.etkinFiltreSayisi() > 0) {
        <button type="button" class="rc-dugme rc-dugme--hayalet rc-dugme--kucuk" (click)="clear()">
          {{ 'finansBelge.temizle' | transloco }}
        </button>
      }
    </div>
  </form>

  @if (canWrite() && createOpen()) {
    <rc-sale-create-form
      [branches]="branches.list.veri()"
      (saved)="saved()"
      (dirtyChange)="dirtyChanged($event)"
    />
  }

  <rc-tablo
    class="tablo"
    tabloKodu="satislar.liste"
    [etiket]="'finansBelge.satis.tabloEtiketi' | transloco"
    [sutunlar]="columns"
    [kaynak]="store.list.durum()"
    [satirKimligi]="rowId"
    [sirala]="query.sorgu().sirala"
    [disaAktarma]="export()"
    (siralaDegisti)="query.degistir({ sirala: $event })"
    (sayfaDegisti)="query.degistir({ sayfa: $event })"
    (boyutDegisti)="query.degistir({ boyut: $event })"
    (yenidenDene)="store.list.yenile()"
  >
    <ng-template rcTabloHucre="satisiVerildi" [rcTabloHucreSutunlar]="columns" let-satir>
      {{
        (satir.satisiVerildi ? 'finansBelge.satis.verildi' : 'finansBelge.satis.isaretlenmemis')
          | transloco
      }}
    </ng-template>
    <ng-template rcTabloHucre="durum" [rcTabloHucreSutunlar]="columns" let-satir>
      <span class="rc-rozet" [class.rc-rozet--hata]="satir.durum === 'Iptal'">{{
        statusLabel(satir.durum)
      }}</span>
    </ng-template>
  </rc-tablo>
</div>
