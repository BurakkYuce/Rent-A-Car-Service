<div class="sayfa">
  <header class="ust">
    <h1>{{ 'finansBelge.faturaSatir.baslik' | transloco }}</h1>
    <div class="ust__eylemler">
      <a class="rc-dugme rc-dugme--kucuk" routerLink="/faturalar">
        {{ 'finansBelge.fatura.baslik' | transloco }}
      </a>
    </div>
  </header>
  <p class="aciklama">{{ 'finansBelge.faturaSatir.aciklama' | transloco }}</p>

  <form
    class="filtre"
    [formGroup]="filterForm"
    [attr.aria-label]="'finansBelge.filtre' | transloco"
    (ngSubmit)="filter()"
  >
    <div class="rc-form-izgara">
      <rc-alan [etiket]="'finansBelge.fatura.ara' | transloco">
        <rc-metin-girdisi formControlName="q" tur="search" [azamiUzunluk]="128" />
      </rc-alan>
      <rc-alan [etiket]="'finansBelge.cari' | transloco">
        <rc-arama-secim formControlName="cari" [kaynak]="customers" />
      </rc-alan>
      <rc-alan [etiket]="'finansBelge.plaka' | transloco">
        <rc-metin-girdisi formControlName="plaka" [azamiUzunluk]="16" />
      </rc-alan>
      <rc-alan [etiket]="'finansBelge.ofis' | transloco">
        <rc-metin-girdisi formControlName="ofis" [azamiUzunluk]="128" />
      </rc-alan>
      <rc-alan [etiket]="'finansBelge.tarihBas' | transloco">
        <rc-tarih-secici formControlName="bas" />
      </rc-alan>
      <rc-alan [etiket]="'finansBelge.tarihBit' | transloco">
        <rc-tarih-secici formControlName="bit" />
      </rc-alan>
      <rc-alan [etiket]="'finansBelge.faturaSatir.iptalleriGizle' | transloco">
        <rc-onay-kutusu formControlName="iptalleriGizle" />
      </rc-alan>
    </div>
    <div class="filtre__eylemler">
      <button type="submit" class="rc-dugme rc-dugme--kucuk">
        <rc-ikon ad="filter" [boyut]="14" />
        {{ 'finansBelge.filtrele' | transloco }}
      </button>
      @if (query.etkinFiltreSayisi() > 0) {
        <button type="button" class="rc-dugme rc-dugme--hayalet rc-dugme--kucuk" (click)="clear()">
          {{ 'finansBelge.temizle' | transloco }}
        </button>
      }
    </div>
  </form>

  <rc-tablo
    class="tablo"
    tabloKodu="faturalar.detay-listesi"
    [etiket]="'finansBelge.faturaSatir.tabloEtiketi' | transloco"
    [sutunlar]="columns"
    [kaynak]="store.list.durum()"
    [satirKimligi]="rowId"
    [sirala]="query.sorgu().sirala"
    [disaAktarma]="export()"
    (siralaDegisti)="query.degistir({ sirala: $event })"
    (sayfaDegisti)="query.degistir({ sayfa: $event })"
    (boyutDegisti)="query.degistir({ boyut: $event })"
    (yenidenDene)="store.list.yenile()"
  />
</div>
