<section class="rc-bolum" aria-labelledby="rc-ceza-odeme">
  <h3 id="rc-ceza-odeme">{{ 'finansBelge.ceza.odemeBaslik' | transloco }}</h3>
  @if (lineOptions().length > 0 || submission.frozen()) {
    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="rc-form-izgara">
        <rc-alan [etiket]="'finansBelge.ceza.kalem' | transloco">
          <rc-secim formControlName="satirId" [secenekler]="lineOptions()" />
        </rc-alan>
        <rc-alan
          [etiket]="'finansBelge.tutar' | transloco"
          [ipucu]="'finansBelge.ceza.tutarIpucu' | transloco"
        >
          <rc-para-girdisi formControlName="tutar" />
        </rc-alan>
        <rc-alan [etiket]="'finansBelge.hesap' | transloco">
          <rc-secim formControlName="hesap" [secenekler]="accountOptions" />
        </rc-alan>
        <rc-alan
          [etiket]="'finansBelge.ceza.odemeTarihi' | transloco"
          [ipucu]="'finansBelge.bosBugun' | transloco"
        >
          <rc-tarih-secici formControlName="tarih" />
        </rc-alan>
        <rc-alan [etiket]="'finansBelge.ceza.makbuzNo' | transloco">
          <rc-metin-girdisi formControlName="makbuzNo" [azamiUzunluk]="64" />
        </rc-alan>
        <rc-alan [etiket]="'finansBelge.ceza.islemYapan' | transloco">
          <rc-metin-girdisi formControlName="islemYapan" [azamiUzunluk]="128" />
        </rc-alan>
        <rc-alan [etiket]="'finansBelge.aciklama' | transloco">
          <rc-metin-girdisi formControlName="aciklama" [azamiUzunluk]="512" />
        </rc-alan>
      </div>
      <rc-money-submit
        [submission]="submission"
        type="submit"
        [label]="'finansBelge.ceza.ode' | transloco"
      />
    </form>
  } @else {
    <p class="not">{{ 'finansBelge.ceza.odenecekYok' | transloco }}</p>
    <!-- Kalem kapanıp form gizlense de önceki denemenin kayıt notu kalır. -->
    <rc-money-notice [notice]="submission.notice()" />
  }
</section>
