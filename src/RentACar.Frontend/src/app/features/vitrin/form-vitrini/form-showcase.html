<div class="rc-sayfa-basligi">
  <h1>Form vitrini</h1>
  <a routerLink="/" class="rc-yazdirma-gizle">Ana sayfa</a>
</div>

<form [formGroup]="form" (ngSubmit)="kaydet()" aria-label="Örnek kayıt formu">
  <rc-sekmeli-form [sekmeler]="tabs" etiket="Form bölümleri">
    <section rcSekmePaneli="genel" baslik="Genel">
      <div class="rc-form-izgara">
        <rc-alan etiket="Plaka" ipucu="Örn. 34 ABC 123">
          <rc-metin-girdisi formControlName="plaka" [azamiUzunluk]="12" />
        </rc-alan>
        <rc-alan etiket="Müşteri">
          <rc-arama-secim formControlName="musteri" [kaynak]="customers" />
        </rc-alan>
        <rc-alan etiket="Durum">
          <rc-secim formControlName="durum" [secenekler]="statuses" />
        </rc-alan>
        <rc-alan etiket="Adet">
          <rc-sayi-girdisi formControlName="adet" />
        </rc-alan>
        <rc-alan etiket="Açıklama" class="rc-form-izgara__genis">
          <rc-metin-alani formControlName="aciklama" [azamiUzunluk]="500" />
        </rc-alan>
      </div>
    </section>

    <section rcSekmePaneli="tarih-tutar" baslik="Tarih ve tutar">
      <div class="rc-form-izgara">
        <rc-alan etiket="Tutar">
          <rc-para-girdisi formControlName="tutar" />
        </rc-alan>
        <rc-alan etiket="Çıkış tarihi">
          <rc-tarih-secici formControlName="cikisTarihi" />
        </rc-alan>
        <rc-alan etiket="Dönüş zamanı">
          <rc-tarih-saat-secici formControlName="donusAni" />
        </rc-alan>
        <rc-alan etiket="Dönem">
          <rc-tarih-secici formControlName="donem" aralik />
        </rc-alan>
      </div>
    </section>

    <section rcSekmePaneli="secenekler" baslik="Seçenekler">
      <div class="rc-form-izgara">
        <rc-alan etiket="Ödeme türü" grup>
          <rc-radyo-grubu formControlName="odemeTuru" [secenekler]="paymentTypes" />
        </rc-alan>
        <rc-alan etiket="Kasko">
          <rc-onay-kutusu formControlName="kasko">Kasko dahil</rc-onay-kutusu>
        </rc-alan>
        <rc-alan etiket="Otomatik fatura">
          <rc-anahtar formControlName="otomatikFatura">Dönüşte kes</rc-anahtar>
        </rc-alan>
        <rc-alan etiket="Koşullar">
          <rc-onay-kutusu formControlName="kosullarOnay"
            >Kiralama koşullarını okudum</rc-onay-kutusu
          >
        </rc-alan>
      </div>
    </section>

    <div rcYanPanel>
      <dl class="ozet" aria-label="Özet">
        <dt>Plaka</dt>
        <dd>{{ form.controls.plaka.value || '—' }}</dd>
        <dt>Tutar</dt>
        <dd class="rc-sayi">{{ summaryAmount() }}</dd>
      </dl>
      <rc-form-hatalari [hatalar]="submission.genelHatalar()" />
      @if (recordNo()) {
        <p class="rc-rozet rc-rozet--basari" role="status">Kaydedildi: {{ recordNo() }}</p>
      }
      <button
        type="submit"
        class="rc-dugme rc-dugme--birincil rc-dugme--buyuk"
        [disabled]="submission.gonderiliyor()"
      >
        {{ submission.gonderiliyor() ? 'Gönderiliyor…' : 'Kaydet' }}
      </button>
    </div>
  </rc-sekmeli-form>
</form>
