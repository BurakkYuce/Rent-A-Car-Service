<div class="sayfa">
  <header class="ust">
    <h1>{{ 'filoKiralama.baslik' | transloco }}</h1>
    <div class="ust__eylemler">
      <a class="rc-dugme rc-dugme--birincil rc-dugme--kucuk" routerLink="/filo-kiralama/yeni">
        <rc-ikon ad="plus" [boyut]="14" />
        {{ 'filoKiralama.yeni' | transloco }}
      </a>
    </div>
  </header>
  <p class="aciklama">{{ 'filoKiralama.aciklama' | transloco }}</p>

  <form
    class="filtre"
    [formGroup]="filtreFormu"
    [attr.aria-label]="'filoKiralama.filtre.baslik' | transloco"
    (ngSubmit)="filtrele()"
  >
    <div class="rc-form-izgara">
      <rc-alan [etiket]="'filoKiralama.filtre.musteri' | transloco">
        <rc-arama-secim formControlName="musteri" [kaynak]="musteriler" />
      </rc-alan>
      <rc-alan [etiket]="'filoKiralama.filtre.plaka' | transloco">
        <rc-metin-girdisi formControlName="plaka" [azamiUzunluk]="32" />
      </rc-alan>
      <rc-alan
        [etiket]="'filoKiralama.filtre.ara' | transloco"
        [ipucu]="'filoKiralama.filtre.araIpucu' | transloco"
      >
        <rc-metin-girdisi formControlName="ara" tur="search" [azamiUzunluk]="100" />
      </rc-alan>
      <rc-alan [etiket]="'filoKiralama.filtre.durum' | transloco">
        <rc-secim
          formControlName="durum"
          [secenekler]="durumSecenekleri"
          [bosEtiket]="'filoKiralama.filtre.tumu' | transloco"
        />
      </rc-alan>
      <rc-alan [etiket]="'filoKiralama.filtre.bas' | transloco">
        <rc-tarih-secici formControlName="bas" />
      </rc-alan>
      <rc-alan [etiket]="'filoKiralama.filtre.bit' | transloco">
        <rc-tarih-secici formControlName="bit" />
      </rc-alan>
    </div>
    <div class="filtre__eylemler">
      <button type="submit" class="rc-dugme rc-dugme--kucuk">
        <rc-ikon ad="filter" [boyut]="14" />
        {{ 'filoKiralama.filtre.filtrele' | transloco }}
      </button>
      @if (liste.etkinFiltreSayisi() > 0) {
        <button
          type="button"
          class="rc-dugme rc-dugme--hayalet rc-dugme--kucuk"
          (click)="temizle()"
        >
          {{ 'filoKiralama.filtre.temizle' | transloco }}
        </button>
      }
    </div>
  </form>

  <p class="ozet" aria-live="polite">{{ ozet() }}</p>

  <rc-tablo
    class="tablo"
    tabloKodu="filo-kiralama.liste"
    [etiket]="'filoKiralama.tabloEtiketi' | transloco"
    [sutunlar]="sutunlar"
    [kaynak]="store.liste.durum()"
    [satirKimligi]="kimlik"
    [sirala]="liste.sorgu().sirala"
    [disaAktarma]="disaAktarma()"
    (siralaDegisti)="liste.degistir({ sirala: $event })"
    (sayfaDegisti)="liste.degistir({ sayfa: $event })"
    (boyutDegisti)="liste.degistir({ boyut: $event })"
    (yenidenDene)="store.liste.yenile()"
    (satirAc)="satiriAc($event)"
  >
    <ng-template rcTabloHucre="no" [rcTabloHucreSutunlar]="sutunlar" let-satir>
      <a class="bag" [routerLink]="['/filo-kiralama', satir.id]">{{ satir.no }}</a>
    </ng-template>
    <ng-template rcTabloHucre="durum" [rcTabloHucreSutunlar]="sutunlar" let-satir>
      <span [class]="rozet(satir.durum)">{{ durumEtiketi(satir.durum) }}</span>
    </ng-template>
  </rc-tablo>
</div>
