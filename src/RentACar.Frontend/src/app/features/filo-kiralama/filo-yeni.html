<div class="sayfa">
  <header class="ust">
    <h1>{{ 'filoKiralama.yeniBaslik' | transloco }}</h1>
    <div class="ust__eylemler">
      <a class="rc-dugme rc-dugme--hayalet rc-dugme--kucuk" routerLink="/filo-kiralama">
        <rc-ikon ad="chevron-left" [boyut]="14" />
        {{ 'filoKiralama.listeyeDon' | transloco }}
      </a>
    </div>
  </header>

  <form class="form" novalidate [formGroup]="form" (ngSubmit)="kaydet()">
    <rc-form-hatalari [hatalar]="gonderim.genelHatalar()" />
    <section class="bolum" aria-labelledby="filo-yeni-sozlesme">
      <h2 id="filo-yeni-sozlesme">{{ 'filoKiralama.bolum.sozlesme' | transloco }}</h2>
      <div class="rc-form-izgara">
        <rc-alan [etiket]="'filoKiralama.alan.musteri' | transloco">
          <rc-arama-secim formControlName="musteri" [kaynak]="musteriler" />
        </rc-alan>
        <rc-alan [etiket]="'filoKiralama.alan.arac' | transloco">
          <rc-arama-secim formControlName="arac" [kaynak]="araclar" />
        </rc-alan>
        <rc-alan [etiket]="'filoKiralama.alan.basTar' | transloco">
          <rc-tarih-secici formControlName="basTar" />
        </rc-alan>
        <rc-alan [etiket]="'filoKiralama.alan.sureAy' | transloco">
          <rc-sayi-girdisi formControlName="sureAy" />
        </rc-alan>
        <rc-alan [etiket]="'filoKiralama.alan.aylikUcret' | transloco">
          <rc-para-girdisi formControlName="aylikUcret" />
        </rc-alan>
        <rc-alan
          [etiket]="'filoKiralama.alan.kdvOrani' | transloco"
          [ipucu]="'filoKiralama.alan.kdvOraniIpucu' | transloco"
        >
          <rc-sayi-girdisi formControlName="kdvOrani" kesir="2" />
        </rc-alan>
        <rc-alan [etiket]="'filoKiralama.alan.damgaVergisi' | transloco">
          <rc-para-girdisi formControlName="damgaVergisi" />
        </rc-alan>
      </div>
    </section>
    <section class="bolum" aria-labelledby="filo-yeni-kunye">
      <h2 id="filo-yeni-kunye">{{ 'filoKiralama.bolum.kunye' | transloco }}</h2>
      <div class="rc-form-izgara">
        <rc-filo-kunye-alanlari [grup]="form" />
      </div>
    </section>
    <div class="form__eylemler">
      <button
        type="submit"
        class="rc-dugme rc-dugme--birincil rc-dugme--kucuk"
        [disabled]="gonderim.gonderiliyor()"
      >
        {{
          (gonderim.gonderiliyor() ? 'filoKiralama.kaydediliyor' : 'filoKiralama.kaydet')
            | transloco
        }}
      </button>
    </div>
  </form>
</div>
