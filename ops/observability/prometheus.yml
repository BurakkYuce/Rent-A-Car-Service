# Prometheus — yalnız OTel Collector'ın prometheus-exporter'ını scrape eder (uygulamayı DEĞİL;
# uygulama /metrics açmaz — OTLP push modeli, ek public yüzey yok).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
