# Loki 3.x — tek-binary (filesystem), tek kutu için minimal. OTLP native alıcı açık (/otlp).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h          # 14 gün (mevcut dosya-log saklamasıyla hizalı)
  allow_structured_metadata: true # OTLP resource/attribute → structured metadata (tenant_id/trace_id)

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
