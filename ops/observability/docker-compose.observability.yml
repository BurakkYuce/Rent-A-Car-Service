# RentACar self-hosted observability yığını (tek kutu). Uygulama OTLP ile PUSH eder (kod değişmez —
# yalnız OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4317 env'i). Collector metrik→Prometheus, log→Loki,
# trace→Tempo yönlendirir; Grafana görselleştirir + alarm verir.
#
# GÜVENLİK: yalnız Collector OTLP (127.0.0.1:4317, host→collector) ve Grafana (127.0.0.1:3000, Caddy arkası)
# host'a açılır. Prometheus/Loki/Tempo yalnız iç docker ağında (host portu YOK). Grafana admin şifresi +
# alarm anahtarı .env'den (bkz. .env.example). Kaynak limitleri tek-kutu içindir.
#
# Çalıştırma: cp .env.example .env && düzenle && docker compose -f docker-compose.observability.yml up -d

name: racar-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC — uygulama buraya push eder (yalnız localhost)
    mem_limit: 300m
    depends_on: [prometheus, loki, tempo]
    networks: [obs]

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"     # metrik saklama
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    mem_limit: 512m
    networks: [obs]                              # host portu YOK — iç ağ

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    mem_limit: 512m
    networks: [obs]

  tempo:
    image: grafana/tempo:2.7.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 400m
    networks: [obs]

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD .env'de zorunlu}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      RACAR_ALERT_TOKEN: ${ALERT_TOKEN:-}         # alarm webhook contact-point anahtarı (provisioning okur)
      RACAR_ALERT_URL: ${ALERT_URL:-http://host.docker.internal:5220/internal/alert}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"   # yalnız localhost → Caddy TLS+auth arkasına al
    extra_hosts:
      - "host.docker.internal:host-gateway"       # alarm webhook host'taki uygulamaya ulaşsın
    mem_limit: 300m
    depends_on: [prometheus, loki, tempo]
    networks: [obs]

networks:
  obs:
    driver: bridge

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
